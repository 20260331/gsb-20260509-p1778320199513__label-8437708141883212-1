<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打飞机游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="lives">生命值: <span id="lives">3</span></div>
            <div class="item-slots">
                <div class="item-slot item-slot-health" id="slotHealth">
                    <span class="slot-icon">♥</span>
                    <span class="slot-label">生命恢复</span>
                    <span class="slot-status" id="slotHealthStatus"></span>
                </div>
                <div class="item-slot item-slot-firepower" id="slotFirepower">
                    <span class="slot-icon">⚡</span>
                    <span class="slot-label">火力增强</span>
                    <span class="slot-status" id="slotFirepowerStatus"></span>
                </div>
                <div class="item-slot item-slot-shield" id="slotShield">
                    <span class="slot-icon">🛡</span>
                    <span class="slot-label">护盾</span>
                    <span class="slot-status" id="slotShieldStatus"></span>
                </div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="game-controls">
            <button id="startBtn">开始游戏</button>
            <button id="pauseBtn">暂停游戏</button>
        </div>
        <div class="game-over" id="gameOver">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
